name: Monitor dependency advisories
on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * 3,6"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dependency-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m pytest -q
      - if: github.event_name != 'pull_request'
        run: python scripts/monitor.py --input dependencies.json --output reports/latest.json
      - if: github.event_name != 'pull_request'
        run: |
          git add reports/latest.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "dependencies: update normalized OSV advisory report"
          git push
